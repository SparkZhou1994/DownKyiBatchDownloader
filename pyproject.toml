[project]
name = "downkyi-bulk-download"
version = "0.1.0"
description = "批量把 BV 号送入 DownKyi 1.6.1 输入框并触发下载的 Python 自动化脚本"
requires-python = ">=3.10"
dependencies = [
    "pywinauto>=0.6.8",
    "pyperclip>=1.8.2",
    "psutil>=7.2.2",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
